<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Appetize Uploader — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: #fff; }
    .subtitle { color: #64748b; font-size: 0.85rem; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 20px;
    }
    .card h2 { font-size: 0.95rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; margin-top: 10px; }
    input, textarea, select {
      width: 100%;
      background: #0f1117;
      border: 1px solid #374151;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: #6366f1; }
    textarea { resize: vertical; font-family: 'Courier New', monospace; font-size: 0.75rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-green { background: #10b981; color: #fff; }
    .btn-gray { background: #374151; color: #e2e8f0; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.83rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-green { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .dot-red { background: #ef4444; }
    .dot-gray { background: #6b7280; }
    .console-wrap {
      background: #0a0c12;
      border: 1px solid #1e2330;
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
    }
    .console-header {
      background: #1e2330;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2d3748;
    }
    .console-header span { font-size: 0.85rem; font-weight: 600; color: #94a3b8; }
    #console {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.5;
      padding: 14px 16px;
      height: 420px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-info { color: #93c5fd; }
    .log-ok { color: #6ee7b7; }
    .log-warn { color: #fbbf24; }
    .log-error { color: #f87171; }
    .log-step { color: #a78bfa; font-weight: bold; }
    .log-dashboard { color: #e879f9; }
    .log-default { color: #cbd5e1; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-green { background: #064e3b; color: #6ee7b7; }
    .badge-gray { background: #1f2937; color: #9ca3af; }
    .msg { font-size: 0.8rem; padding: 6px 10px; border-radius: 6px; margin-top: 8px; }
    .msg-ok { background: #064e3b; color: #6ee7b7; }
    .msg-err { background: #7f1d1d; color: #fca5a5; }
    #command-fields { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🤖 Appetize Uploader</h1>
  <p class="subtitle">Tableau de bord — gestion des sessions et uploads APK</p>

  <div class="status-bar">
    <div class="dot dot-gray" id="proc-dot"></div>
    <span id="proc-status">Chargement…</span>
    <span style="margin-left:auto;display:flex;gap:8px;align-items:center;">
      <span>Cookies :</span>
      <span class="badge badge-gray" id="cookie-badge">—</span>
    </span>
  </div>

  <div class="grid">
    <!-- COOKIES -->
    <div class="card">
      <h2>🍪 Session Appetize (Cookies)</h2>
      <p style="font-size:0.8rem;color:#64748b;margin-bottom:10px;">
        Colle le contenu JSON de tes cookies Appetize (format Playwright ou exportés depuis DevTools).
      </p>
      <label for="cookies-input">cookies.json — contenu JSON</label>
      <textarea id="cookies-input" rows="8" placeholder='[{"name":"session","value":"abc...","domain":"appetize.io",...}]'></textarea>
      <div id="cookie-msg"></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveCookies()">💾 Sauvegarder les cookies</button>
        <button class="btn btn-danger" onclick="deleteCookies()">🗑 Supprimer</button>
      </div>
    </div>

    <!-- RUN -->
    <div class="card">
      <h2>🚀 Lancer le script</h2>
      <label for="cmd-select">Commande</label>
      <select id="cmd-select" onchange="updateCommandFields()">
        <option value="upload">upload — envoyer un APK</option>
        <option value="list">list — lister les apps</option>
        <option value="delete">delete — supprimer une app</option>
      </select>

      <div id="command-fields">
        <label for="repo-input">Repo GitHub (owner/repo)</label>
        <input type="text" id="repo-input" placeholder="ferelking242/watchtower" />

        <label for="runid-input">Run ID (GitHub Actions)</label>
        <input type="text" id="runid-input" placeholder="24347257733" />

        <label for="artifact-input">Nom de l'artefact</label>
        <input type="text" id="artifact-input" placeholder="app-arm64-profile" />
      </div>

      <div id="run-msg"></div>
      <div class="btn-row">
        <button class="btn btn-green" id="run-btn" onclick="runScript()">▶ Lancer</button>
        <button class="btn btn-danger" id="stop-btn" onclick="stopScript()" disabled>⏹ Arrêter</button>
      </div>
    </div>
  </div>

  <!-- CONSOLE -->
  <div class="console-wrap">
    <div class="console-header">
      <span>📟 Logs en temps réel</span>
      <button class="btn btn-gray" style="padding:4px 12px;font-size:0.75rem;" onclick="clearConsole()">Effacer</button>
    </div>
    <div id="console"></div>
  </div>

  <script>
    const BASE = '';

    function updateCommandFields() {
      const cmd = document.getElementById('cmd-select').value;
      const fields = document.getElementById('command-fields');
      fields.style.display = cmd === 'upload' ? 'block' : 'none';
    }
    updateCommandFields();

    function appendLog(raw) {
      const console_ = document.getElementById('console');
      const div = document.createElement('div');
      let cls = 'log-default';
      if (raw.includes('[INFO]'))      cls = 'log-info';
      else if (raw.includes('[OK]'))   cls = 'log-ok';
      else if (raw.includes('[WARN]')) cls = 'log-warn';
      else if (raw.includes('[ERROR]') || raw.includes('[ERR]')) cls = 'log-error';
      else if (raw.includes('[STEP]')) cls = 'log-step';
      else if (raw.includes('[DASHBOARD]')) cls = 'log-dashboard';
      else if (raw.includes('═'))      cls = 'log-step';
      div.className = cls;
      div.textContent = raw;
      console_.appendChild(div);
      console_.scrollTop = console_.scrollHeight;
    }

    function clearConsole() {
      document.getElementById('console').innerHTML = '';
    }

    let sse = null;
    function connectSSE() {
      if (sse) sse.close();
      sse = new EventSource(`${BASE}/api/appetize/logs`);
      sse.onmessage = (e) => {
        try { appendLog(JSON.parse(e.data)); } catch { appendLog(e.data); }
      };
      sse.onerror = () => {
        appendLog('[DASHBOARD] Connexion SSE perdue — reconnexion dans 3s…');
        setTimeout(connectSSE, 3000);
      };
    }
    connectSSE();

    async function fetchStatus() {
      try {
        const r = await fetch(`${BASE}/api/appetize/status`);
        const d = await r.json();
        const dot = document.getElementById('proc-dot');
        const label = document.getElementById('proc-status');
        const badge = document.getElementById('cookie-badge');
        const runBtn = document.getElementById('run-btn');
        const stopBtn = document.getElementById('stop-btn');

        if (d.running) {
          dot.className = 'dot dot-green';
          label.textContent = 'Processus en cours…';
          runBtn.disabled = true;
          stopBtn.disabled = false;
        } else {
          dot.className = 'dot dot-gray';
          label.textContent = 'Aucun processus actif';
          runBtn.disabled = false;
          stopBtn.disabled = true;
        }

        badge.textContent = d.cookiesExist ? '✓ Présents' : '✗ Absents';
        badge.className = d.cookiesExist ? 'badge badge-green' : 'badge badge-gray';
      } catch {}
    }
    fetchStatus();
    setInterval(fetchStatus, 3000);

    function showMsg(id, text, ok) {
      const el = document.getElementById(id);
      el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
      el.textContent = text;
      setTimeout(() => { el.textContent = ''; el.className = ''; }, 4000);
    }

    async function saveCookies() {
      const raw = document.getElementById('cookies-input').value.trim();
      if (!raw) { showMsg('cookie-msg', 'Colle tes cookies JSON d\'abord', false); return; }
      try {
        JSON.parse(raw);
      } catch {
        showMsg('cookie-msg', 'JSON invalide — vérifie le format', false);
        return;
      }
      const r = await fetch(`${BASE}/api/appetize/cookies`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cookies: raw }),
      });
      const d = await r.json();
      if (r.ok) { showMsg('cookie-msg', '✓ Cookies sauvegardés', true); fetchStatus(); }
      else showMsg('cookie-msg', d.error || 'Erreur', false);
    }

    async function deleteCookies() {
      const r = await fetch(`${BASE}/api/appetize/cookies`, { method: 'DELETE' });
      const d = await r.json();
      if (r.ok) { showMsg('cookie-msg', 'Cookies supprimés', true); fetchStatus(); }
      else showMsg('cookie-msg', d.error || 'Erreur', false);
    }

    async function runScript() {
      const command = document.getElementById('cmd-select').value;
      const body = { command };
      if (command === 'upload') {
        body.repo = document.getElementById('repo-input').value.trim();
        body.runId = document.getElementById('runid-input').value.trim();
        body.artifactName = document.getElementById('artifact-input').value.trim();
      }
      const r = await fetch(`${BASE}/api/appetize/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const d = await r.json();
      if (r.ok) { showMsg('run-msg', '✓ Script lancé (PID ' + d.pid + ')', true); fetchStatus(); }
      else showMsg('run-msg', d.error || 'Erreur', false);
    }

    async function stopScript() {
      const r = await fetch(`${BASE}/api/appetize/stop`, { method: 'POST' });
      const d = await r.json();
      if (r.ok) showMsg('run-msg', 'Signal d\'arrêt envoyé', true);
      else showMsg('run-msg', d.error || 'Erreur', false);
    }
  </script>
</body>
</html>
